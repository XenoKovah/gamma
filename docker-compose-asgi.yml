version: '3'

services:

  dashboard-asgi:
    container_name: gamma_dashboard_asgi
    build:
      context: .
      args:
        - node_env=dev
    env_file:
      - ./envs/base.env
      - ./envs/private.env
    command: python manage.py runserver 0.0.0.0:9100
    volumes:
      - .:/app
    ports:
      - "9100:9100"
    links:
      - mongo
      - postgres
      - celery_worker
      - celery_beat
      - api-asgi
  
  api-asgi:
    container_name: gamma_api_asgi
    build:
      context: .
      args:
        - node_env=dev
    env_file:
      - ./envs/base.env
      - ./envs/private.env
    command: uvicorn gamma.asgi:application --host 0.0.0.0 --port 9191
    volumes:
      - .:/app
    ports:
      - "9191:9191"
    links:
      - mongo
      - postgres

  celery_worker: &celery_worker
    container_name: gamma_celery_worker
    build:
      context: .
      dockerfile: Dockerfile-celery
    command: celery worker -A gamma --loglevel=INFO
    env_file:
      - ./envs/base.env
      - ./envs/private.env
    volumes:
      - .:/app
    links:
      - rabbit
      - redis

  celery_beat:
    <<: *celery_worker
    container_name: gamma_celery_beat
    command: celery beat -A gamma --loglevel=INFO

  mongo:
    container_name: gamma_mongo
    image: mongo:4.2
    ports:
      - "27017:27017"
    volumes:
      - mongo_db:/data/db

  postgres:
    container_name: gamma_postgres
    image: postgres:12.1
    env_file:
      - ./envs/base.env
      - ./envs/private.env
    volumes:
        - pg_db:/var/lib/postgresql/data/

  rabbit:
    container_name: gamma_rabbit
    image: rabbitmq:latest

  redis:
    container_name: gamma_redis
    image: redis:latest

volumes:
  pg_db:
  mongo_db:
