<script>
Highcharts.setOptions({
     colors: [
         '#419e4d',
         '#4599C3',
         '#FFCD00',
         '#E87722',
         '#00B5E2',
         '#6244BB',
         '#888B8D',
         '#FF0000',
     ],
     chart: {
        style: {
            fontFamily: "'Open Sans', sans-serif"
        }
    }
});

var chartTitleStyles = {
    color: '#3caada',
    fontSize: '18px',
    textTransform: 'uppercase',
    fontFamily: 'Exo2',
    fontWeight: 600,
};

var chartSubtitleStyles = {
  color: '#bcbcbc',
  fontSize: '16px',
  lineHeight: '20px',
  fontFamily: 'Exo2',
  fontWeight: 300,
};

var chartTitleOptions = {
    buttonOptions: {
        x: 5,
        y: -5,
        symbolStroke: '#00abd9',
        theme: {
            fill: 'transparent',
            states: {
                hover: {
                    fill: 'transparent',
                },
                select: {
                    fill: 'transparent',
                }
            }
        }
    }
};

var yAxisOptions = {
  gridLineColor: '#6c6d6e',
  gridLineDashStyle: 'dash',
  lineColor: '#aaa',
  lineWidth: 1,
};

$(function() {
    $.get(
        "/api/v0/points/",
        data={"username": "{{ request.user.username }}"},
        function( points ) {
            $.get(
                "/api/v0/chart/",
                data={"username": "{{ request.user.username }}"},
                function( data ) {
                    var events = [];
                    for (var key in data) {
                        events.splice(data[key][0], 0, {name: key, y : data[key][1]});
                    }
                    $('#container-chart').highcharts({
                        chart: {
                            plotBackgroundColor: null,
                            plotBorderWidth: 0,
                            plotShadow: false
                        },
                        title: {
                            text: 'Achievement',
                            align: 'left',
                            widthAdjust: 0,
                            x: -5,
                            style: chartTitleStyles,
                        },
                        subtitle: {
                            text: 'Web accessibility testing is a subset of usability testing where the users under consideration have disabilities',
                            align: 'left',
                            widthAdjust: 0,
                            x: -5,
                            style: chartSubtitleStyles,
                        },
                        navigation: chartTitleOptions,
                        tooltip: {
                            pointFormat: '{series.name}: <b>{point.percentage:.1f}%</b>'
                        },
                        plotOptions: {
                            pie: {
                                dataLabels: {
                                    enabled: true,
                                    distance: -50,
                                    style: {
                                        fontWeight: 'bold',
                                        color: 'white',
                                        textShadow: 'unset'
                                    }
                                },
                                startAngle: -90,
                                endAngle: 90,
                                center: ['50%', '75%'],
                                showInLegend: true
                            }
                        },
                        series: [{
                            type: 'pie',
                            name: 'Points share',
                            innerSize: '50%',
                            data: events
                        }]
                    });
                }
            );
            $.get(
                "/api/v0/badges/",
                data={"username": "{{ request.user.username }}"},
                function( data ) {
                    for (i in data) {                      
                        if ( !data[i].done ) {
                            var style = 'style="-webkit-filter: grayscale(100%); filter: grayscale(100%);"';
                        }   
                        else {  
                            var style = ''
                        }
                        $('#container-badges').append(
                            '<img src="https://youtrack.raccoongang.com/_classpath/smartui/img/default/youtrack-sign.svg"' + style + 'height="200" width="200">'
                        );

                        if ( !data[i]["done"] ) {
                            for (_ in data[i]) {
                                console.log(data[i][_]["count"]);
                                if ( _ !== 'done' ) {
                                    $('#container-badges').append(_ + ": " + data[i][_]["count"] + " of " + data[i][_]["goal"] + "  || ");
                                }
                            }
                        }
                    }
                }
            );
            $.get(
                "/api/v0/user-statuses/",
                data={"username": "{{ request.user.username }}"},
                function( data ) {
                    for (i in data) {                      
                        if ( !data[i].done ) {
                            var style = 'style="-webkit-filter: grayscale(100%); filter: grayscale(100%);"';
                        }   
                        else {  
                            var style = ''
                        }
                        $('#container-statuses').append(
                            '<img src="'+data[i].url+'" alt="'+data[i].description+'" title="'+data[i].description+'"'+'" height="200" width="200">'
                        );
                    }
                }
            );
            $.get(
                "/api/v0/statuses/",
                function( data ) {
                    var status_lines = [];
                    var left = [];
                    var right = [];
                    for (i in data) {
                        if (data[i].status_points <= points.points) {
                            left.push(data[i].status_points);
                        }
                        else if (data[i].status_points > points.points) {
                            right.push(data[i].status_points);
                        }
                        status_lines.push({
                          color: data[i].status_color,
                          dashStyle: 'longdashdot',
                          value: data[i].status_points,
                          width: 5,
                          label: {text: data[i].title, rotation: 0}
                        });
                    }
                    if (left.length == 0) {
                        var min_value = points.points - 40;
                    }
                    else {
                        var min_value = Math.max(...left) - 40;
                    }
                    if (right.length == 0) {
                        var max_value = points.points + 20;
                    }
                    else {
                        var max_value = Math.min(...right) + 20;
                        var points_to_status = max_value - points.points - 20;
                    }
                    if (min_value < 0) {
                        min_value = 0;
                    }
                    $('#container-progress').highcharts({
                        chart: {
                            type: 'bar'
                        },
                        title: {
                          text: 'Points to the next level',
                          align: 'left',
                          widthAdjust: 0,
                          x: -5,
                          style: chartTitleStyles,
                        },
                        subtitle: {
                            text: 'Web accessibility testing is a subset of usability testing where the users under consideration have disabilities',
                            align: 'left',
                            widthAdjust: 0,
                            x: -5,
                            y: 47,
                            style: chartSubtitleStyles,
                        },
                        navigation: chartTitleOptions,
                        xAxis: {
                            categories: [''],
                            title: {
                                text: null
                            },
                            tickWidth: 0,
                            lineColor: '#aaa',
                        },
                        yAxis: {
                            min: min_value,
                            max: max_value,
                            title: {
                              enabled: null,
                            },
                            labels: {
                                overflow: 'justify'
                            },
                            plotLines: status_lines,
                        },
                        yAxis: yAxisOptions,
                        tooltip: {
                            shared: true,
                            useHTML: true,
                            formatter: function() {
                                tooltip_html = 'Points to next status: '+'<b>'+points_to_status+'</b>';
                                tooltip_html += "<table>";

                                this.points.forEach(function(entry) {
                                    tooltip_html += '<tr><td style="font-weight:bold; color:'+ entry.series.color +'">'+ entry.series.name +':</td><td style="text-align: right"> '+entry.y+'</td></tr>';
                                });

                                tooltip_html += "</table>";

                                return tooltip_html;
                            },
                        },
                        plotOptions: {
                            bar: {
                                dataLabels: {
                                    enabled: true,
                                    style: {
                                        fill: 'transparent'
                                    }
                                }
                            },
                          series: {
                            borderColor: '#aaa',
                            borderRadius: 3,
                            dataLabels: {
                              enabled: true,
                              color: '#fafafa',
                              style: {
                                fontWeight: 'bold',
                                textOutline: 'none',
                                fontFamily: 'Exo2',
                              }
                            }
                          }
                        },
                        credits: {
                            enabled: false
                        },
                        legend: {
                          itemStyle: {
                            color: '#bcbcbc',
                            fontWeight: 'bold',
                            fontSize: '12px',
                            textTransform: 'uppercase'
                          },
                          itemHoverStyle: {
                            color: '#aaa'
                          }
                        },
                        series: [{
                            name: 'Progress',
                            data: [points.points]
                        }]
                    });
                }
            );
        }
    );
});
</script>
<script>
$(function () {
    $.get(
        "/api/v0/progress/",
        data={"username": "{{ request.user.username }}"},
        function( data ) {
            var points_by_day = [];
            var accumulative_data = [];
            for (var i in data) {
                points_by_day.push([Date.parse(data[i].date), data[i].points]);
                var accum = 0;
                if (accumulative_data.length != 0) {
                    accum = accumulative_data[accumulative_data.length-1][1] + data[i].points;
                }
                else {
                    accum = data[i].points;
                }
                accumulative_data.push([Date.parse(data[i].date), accum]);
            }

            $('#container-progress-accumulated').highcharts({
                chart: {
                    type: 'spline'
                },
                title: {
                    text: 'Your progress',
                    align: 'left',
                    widthAdjust: 0,
                    x: -5,
                    style: chartTitleStyles,
                },
                subtitle: {
                    text: 'Web accessibility testing is a subset of usability testing where the users under consideration have disabilities that affect how they use the web. The end goal, in both usability and accessibility, is to discover how easily people can use ',
                    align: 'left',
                    widthAdjust: 0,
                    x: -5,
                    style: chartSubtitleStyles,
                },
                navigation: chartTitleOptions,
                xAxis: {
                    type: 'datetime',
                    dateTimeLabelFormats: {
                        month: '%e. %b',
                        year: '%b'
                    },
                    title: {
                        text: 'Date'
                    }
                },
                yAxis: [{
                    title: {
                        text: null
                    },
                    labels: {
                        align: 'left',
                        x: 3,
                        y: 16,
                        format: '{value:.,0f}'
                    },
                    showFirstLabel: false
                }, {
                    gridLineWidth: 0,
                    opposite: true,
                    title: {
                        text: null
                    },
                    labels: {
                        align: 'right',
                        x: -3,
                        y: 16,
                        format: '{value:.,0f}'
                    },
                    showFirstLabel: false
                }],
                tooltip: {
                    headerFormat: '<b>{series.name}</b><br>',
                    pointFormat: '{point.x:%e. %b}: {point.y:.2f}'
                },

                plotOptions: {
                    spline: {
                        marker: {
                            enabled: true
                         }
                     }
                },

                series: [{
                    name: 'Points',
                    type: 'column',
                    data: points_by_day
                },
                {
                    name: 'Progress',
                    type: 'area',
                    yAxis: 1,
                    data: accumulative_data
                }]
            });
        }
    );
});
</script>
