{% load static %}
<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta content="width=device-width, initial-scale=1" name="viewport"/>
        {% block css %}
        {% endblock %}
        {% block base_style %}
            <link href="{% static 'webpack_bundles/avatar-app/temporary_static/all.css' %}" rel="stylesheet" type="text/css"/>
            <link href="{% static 'webpack_bundles/avatar-app/temporary_static/styles.css' %}" rel="stylesheet" type="text/css"/>
        {% endblock %}

        <link href="https://fonts.googleapis.com" rel="preconnect">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css"/>
        <link crossorigin href="https://fonts.gstatic.com" rel="preconnect">
        <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&display=swap" rel="stylesheet">

        <title>Avatar Page</title>
    </head>    
<body>
    <main role="main" class="container">
        <div class="starter-template">
            <h1>Welcome Avatar Page</h1>
            <p class="lead">Use this template as a starting point for your own Django projects.</p>
        </div>
    </main>
{% block content %}
{% endblock %}
    
{% block js %}
{% endblock %}

<script src="{% static 'webpack_bundles/avatar-app/temporary_static/jquery/jquery-3.7.1.min.js' %}"></script>
<script src="{% static 'webpack_bundles/avatar-app/temporary_static/select2.min.js' %}"></script>
<script src="{% static 'webpack_bundles/avatar-app/temporary_static/main.js' %}"></script>

<script src="{% static 'webpack_bundles/avatar-app/temporary_static/student_dashboard.js' %}"></script>

</body>
</html>
