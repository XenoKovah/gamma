version: '3'

services:

  dashboard:
    container_name: gamma_dashboard
    build:
      context: .
      args:
        - node_env=dev
    env_file:
      - ./envs/test.env
    command: python manage.py runserver 0.0.0.0:9000
    volumes:
      - .:/app
    ports:
      - "9000:9000"
    links:
      - postgres
      - celery_worker
      - celery_beat

  celery_worker: &celery_worker
    container_name: gamma_celery_worker
    build:
      context: .
      target: base
    command: celery worker -A gamma --loglevel=INFO
    env_file:
      - ./envs/test.env
    volumes:
      - .:/app
    links:
      - rabbit
      - redis

  celery_beat:
    <<: *celery_worker
    container_name: gamma_celery_beat
    command: celery beat -A gamma --loglevel=INFO

  postgres:
    container_name: gamma_postgres
    image: postgres:12.1
    env_file:
      - ./envs/test.env
    volumes:
        - pg_db:/var/lib/postgresql/data/

  rabbit:
    container_name: gamma_rabbit
    image: rabbitmq:latest

  redis:
    container_name: gamma_redis
    image: redis:latest

volumes:
  pg_db:
