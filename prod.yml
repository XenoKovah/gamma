version: '3'

services:

  dashboard:
    restart: unless-stopped
    container_name: gamma_dashboard
    build:
      context: .
      args:
        - node_env=prod
    env_file:
      - ./envs/base.env
      - ./envs/private.env
    command: gunicorn --config ../.conf/gunicorn/gunicorn.conf -b :9000 gamma.wsgi
    volumes:
      - ./gamma/media/:/app/gamma/media/
    ports:
      - "9000:9000"
    links:
      - mongo
      - postgres
      - celery

  celery:
    restart: unless-stopped
    container_name: gamma_celery
    build:
      context: .
      dockerfile: Dockerfile-celery
    command: celery worker -A gamma --loglevel=INFO -B
    env_file:
      - ./envs/base.env
      - ./envs/private.env
    links:
      - rabbit
      - redis

  mongo:
    restart: unless-stopped
    container_name: gamma_mongo
    image: mongo:4.2
    volumes:
      - mongo_db:/data/db

  postgres:
    restart: unless-stopped
    container_name: gamma_postgres
    image: postgres:12.1
    env_file:
      - ./envs/base.env
      - ./envs/private.env
    volumes:
        - pg_db:/var/lib/postgresql/data/

  rabbit:
    restart: unless-stopped
    container_name: gamma_rabbit
    image: rabbitmq:latest

  redis:
    restart: unless-stopped
    container_name: gamma_redis
    image: redis:latest

volumes:
  pg_db:
  mongo_db:
